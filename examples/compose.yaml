services:
  pandora-exporter:
    build:
      context: ..
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:9349:9349"
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
volumes:
  prometheus-data:
